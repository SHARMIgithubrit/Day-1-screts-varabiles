name: Artifacts CI Pipeline
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: Day-3

        steps:
        # Step 1: Checkout the code
        - name: Checkout code
          uses: actions/checkout@v4
    
        # Step 2: Set up Node.js
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
    
        # Step 3: Install dependencies
        - name: Install dependencies
          run: npm install
        # Step 4: Run unit tests
        - name: Run unit tests
          run: npm test
    
        # Step 5: Run tests
        - name: Run tests
          run: npm test
    
        # Step 6: Build the application
        - name: Build application
          run: npm run build
    
        # Step 7: Upload build artifacts (optional)
        - name: Upload build artifacts
          uses: actions/upload-artifact@v4
          with:
            name: nodejs-build    
            path: Day-3/build
            retention-days: 7
    # job2
    # JOB 2: DOWNLOAD AND DEPLOY
    deploy:
        name: Download and Deploy
        runs-on: ubuntu-latest
        needs: build

        steps:
        - name: Download Artifact
          uses: actions/download-artifact@v4
          with:
            name: nodejs-build
            path: deployment-package/

        - name: Verify Artifact
          run: ls -la deployment-package/

        - name: Prepare Deployment
          run: |
            mkdir -p deployment
            cp -r deployment-package/. deployment/
            echo "Artifact is ready for deployment"

        - name: Deployment Verification
          run: |
            echo "Deployment package contents:"
            ls -la deployment/

