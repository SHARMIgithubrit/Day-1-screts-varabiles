
name: Day 04 Artifacts

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  # JOB 1: BUILD AND UPLOAD ARTIFACTS
  build:
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout the code
      - name: Checkout the code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Day-3/package-lock.json

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: Day-3
        run: npm ci

      # Step 4: Run lint
      - name: Run lint
        working-directory: Day-3
        run: npm run lint

      # Step 5: Run tests with coverage
      - name: Run tests with coverage
        working-directory: Day-3
        run: npm run test:coverage

      # Step 6: Create build artifact
      - name: Create build artifact
        working-directory: Day-3
        run: npm run build

      # Step 7: Display build artifact
      - name: Display build artifact
        run: |
          echo "Build artifact content:"
          ls -la Day-3/dist/

      # Step 8: Upload build artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-build-artifact
          path: Day-3/dist/
          if-no-files-found: error
          retention-days: 5

      # Step 9: Upload coverage report
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-coverage-report
          path: Day-3/coverage/
          if-no-files-found: error
          retention-days: 5

  # JOB 2: DOWNLOAD AND DEPLOY
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:

      # Step 1: Download build artifact
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nodejs-build-artifact
          path: deploy/build/

      # Step 2: Download coverage report
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: nodejs-coverage-report
          path: deploy/coverage/

      # Step 3: Verify downloaded artifacts
      - name: Verify downloaded artifacts
        run: |
          echo "Downloaded build artifact:"
          ls -la deploy/build/

          echo "Downloaded coverage report:"
          ls -la deploy/coverage/

      # Step 4: Display build content
      - name: Display build content
        run: |
          echo "Build artifact content:"
          cat deploy/build/app.js

      # Step 5: Deploy art 
name: Artifact Management Pipeline
on:
  push:
    branches:
      - main
 
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Day 3
 
    steps:
      # Step 1: Checkout
      - name: Checkout Code
        uses: actions/checkout@v4
 
      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
 
      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: npm ci
 
      # Step 4: Build Application
      - name: Build Application
        run: npm run build
 
      # Step 5: Upload Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-build
          path: dist/
          retention-days: 7
 
  download:
    runs-on: ubuntu-latest
    needs: build
 
    steps:
      # Step 6: Download Artifact
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nodejs-build
          path: downloaded-build/
 
      # Step 7: Verify Downloaded Files
      - name: Verify Artifact
        run: ls -la downloaded-build/
 
 
