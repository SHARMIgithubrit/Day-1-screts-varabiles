
name: Artifact Management Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Day-3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Day-3/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Display Build Files
        run: |
          echo "Build artifact content:"
          ls -la dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-build
          path: Day-3/dist/
          if-no-files-found: error
          retention-days: 7

  download:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nodejs-build
          path: downloaded-build/

      - name: Verify Artifact
        run: |
          echo "Downloaded artifact files:"
          ls -la downloaded-build/

      - name: Display Build Content
        run: cat downloaded-build/app.js

      - name: Deploy Artifact
        run: |
          echo "Deploying Node.js build artifact..."
          ls -la downloaded-build/
          echo "Deployment completed successfully."
