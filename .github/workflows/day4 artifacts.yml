
name: Artifacts CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # JOB 1: BUILD AND UPLOAD ARTIFACTS
  build:
    name: Build and Upload
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Day-3

    steps:
      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Day-3/package-lock.json

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run linting
      - name: Run Lint
        run: npm run lint

      # Step 5: Run tests with coverage
      - name: Run Tests with Coverage
        run: npm run test:coverage

      # Step 6: Build application
      - name: Build Application
        run: npm run build

      # Step 7: Upload build artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-build
          path: Day-3/dist/
          if-no-files-found: error
          retention-days: 7

      # Step 8: Upload coverage reports
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-coverage
          path: Day-3/coverage/
          if-no-files-found: error
          retention-days: 7

  # JOB 2: DOWNLOAD AND DEPLOY
  deploy:
    name: Download and Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Step 1: Download build artifact
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nodejs-build
          path: deployment/dist/

      # Step 2: Download coverage artifact
      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: nodejs-coverage
          path: deployment/coverage/

      # Step 3: Verify downloaded files
      - name: Verify Artifacts
        run: |
          echo "Build files:"
          ls -la deployment/dist/

          echo "Coverage files:"
          ls -la deployment/coverage/

      # Step 4: Deployment preparation
      - name: Deployment Preparation
        run: echo "Build and coverage artifacts downloaded successfully"
