name: screts and varaibles
on: 
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  screts-demo:
   runs-on: ubuntu-latest
   steps:
    #step-1 checkout the code
    - name: checkout the code
      uses: actions/checkout@v4
    # step-2 Display the variables
    - name: Display the variables
      run: |
        echo "image name${{ vars.IMAGE_NAME }}"
        echo "envrironment name${{ vars.git }}"
    # step-3 docker login
    - name: docker login
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}    
    # step-4 verify login
    - name: verify login
      run: |
        docker info
        echo "docker login successfully"








