name: Day 5 - Multi Job Workflow
on:
  workflow_dispatch:
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        working-directory: Day-3
        run: npm install

      - name: Run Tests
        working-directory: Day-3
        run: npm test

  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Application
        working-directory: Day-3
        run: npm run build

      - name: Display Build Files
        run: |
          echo "Build artifact content:"
          ls -la Day-3/dist/
  job3:
    runs-on: ubuntu-latest
    needs: job2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nodejs-build
  job4:
    runs-on: ubuntu-latest
    needs: job3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        working-directory: Day-3
        run: npm install

      - name: Run Tests
        working-directory: Day-3
        run: npm test           
