
name: Day 5 - Multi Job Workflow

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # JOB 1: TEST
  test:
    name: Job 1 - Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: Day-3
        run: npm install

      - name: Run Tests
        working-directory: Day-3
        run: npm test


  # JOB 2: BUILD
  build:
    name: Job 2 - Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: Day-3
        run: npm install

      - name: Build Application
        working-directory: Day-3
        run: npm run build

      - name: Display Build Files
        run: ls -la Day-3/dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-build
          path: Day-3/dist/
          if-no-files-found: error
          retention-days: 5


  # JOB 3: DOCKER
  docker:
    name: Job 3 - Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nodejs-build
          path: Day-3/dist/

      - name: Verify Dockerfile
        working-directory: Day-3
        run: |
          pwd
          ls -la
          ls -la dist/
          test -f Dockerfile

      - name: Build Docker Image
        working-directory: Day-3
        run: |
          docker build \
            -f Dockerfile \
            -t nodejs-day5:latest \
            .

      - name: Verify Docker Image
        run: docker image inspect nodejs-day5:latest

      - name: Save Docker Image
        run: docker save -o nodejs-image.tar nodejs-day5:latest

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: nodejs-image.tar
          if-no-files-found: error
          retention-days: 5


  # JOB 4: DEPLOY
  deploy:
    name: Job 4 - Deploy
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: deploy/

      - name: Verify Docker Image File
        run: ls -lh deploy/

      - name: Load Docker Image
        run: docker load -i deploy/nodejs-image.tar

      - name: Verify Loaded Image
        run: docker images nodejs-day5

      - name: Deploy Application
        run: |
          echo "Starting deployment..."
          echo "Docker image loaded successfully."
          echo "Application is ready for deployment."

      - name: Deployment Status
        run: echo "Deployment job completed successfully!"
