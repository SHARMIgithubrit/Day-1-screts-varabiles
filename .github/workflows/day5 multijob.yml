name: Day 5 - Multi Job Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # JOB 1: TEST
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: Day-3
        run: npm install

      - name: Run Tests
        working-directory: Day-3
        run: npm test


  # JOB 2: BUILD
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: Day-3
        run: npm install

      - name: Build Application
        working-directory: Day-3
        run: npm run build

      - name: Display Build Files
        run: ls -la Day-3/dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-build
          path: Day-3/dist/
          if-no-files-found: error
          retention-days: 5


  # JOB 3: DOCKER
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Dockerfile Exists
        run: ls -la Day-3/

      - name: Build Docker Image
        working-directory: Day-3
        run: docker build -t nodejs-day5:latest .

      - name: Test Docker Image
        run: |
          docker run -d --rm --name test-app -p 8080:80 nodejs-day5:latest
          curl -f --retry 5 --retry-connrefused --retry-delay 1 http://localhost:8080
          docker stop test-app

      - name: Save Docker Image
        run: docker save -o nodejs-image.tar nodejs-day5:latest

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: nodejs-image.tar
          retention-days: 5


  # JOB 4: DEPLOY
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: deploy/

      - name: Load Docker Image
        run: docker load -i deploy/nodejs-image.tar

      - name: Deploy Application
        run: |
          echo "Starting deployment..."
          docker run -d --rm --name app -p 8080:80 nodejs-day5:latest
          curl -f --retry 5 --retry-connrefused --retry-delay 1 http://localhost:8080
          docker stop app
          echo "Application container executed successfully."

      - name: Deployment Status
        run: echo "Deployment job completed successfully!"